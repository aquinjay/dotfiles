# hypridle: dims, locks and turns off the screen when idle.
# Started from hyprland.lua. Note: this setup uses a Lua Hyprland config, so
# dispatches must use Lua syntax: hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'

general {
    lock_cmd = pidof hyprlock || hyprlock          # what "loginctl lock-session" runs
    before_sleep_cmd = loginctl lock-session       # lock before suspend / lid close
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 4 min: dim the screen
listener {
    timeout = 240
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# 5 min: lock
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5.5 min: screen off
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })' && brightnessctl -r
}
