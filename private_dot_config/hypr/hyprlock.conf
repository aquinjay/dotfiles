# hyprlock: lock screen. Colors match the CachyOS palette in hyprland.lua.

general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = screenshot        # blurred snapshot of the desktop
    blur_passes = 3
    blur_size = 8
    brightness = 0.6
}

# Time
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(ffffffff)
    font_size = 110
    font_family = FantasqueSansM Nerd Font
    position = 0, 180
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(82dcccff)
    font_size = 22
    font_family = FantasqueSansM Nerd Font
    position = 0, 70
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 55
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = rgba(00aa84ff)
    inner_color = rgba(111826cc)
    font_color = rgba(ffffffff)
    check_color = rgba(01ccffff)
    fail_color = rgba(eb4d4bff)
    fail_text = <i>wrong password ($ATTEMPTS)</i>
    placeholder_text = <i>password</i>
    fade_on_empty = false
    rounding = 8
    position = 0, -60
    halign = center
    valign = center
}
