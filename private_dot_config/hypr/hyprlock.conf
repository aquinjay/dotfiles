# hyprlock: lock screen. Colors come from hyprlock-colors.conf, generated by matugen
# from the wallpaper (SUPER + SHIFT + W).
source = /home/alfie/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = screenshot        # blurred snapshot of the desktop
    blur_passes = 3
    blur_size = 8
    brightness = 0.6
}

# Time
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $on_surface
    font_size = 110
    font_family = FantasqueSansM Nerd Font
    position = 0, 180
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $tertiary
    font_size = 22
    font_family = FantasqueSansM Nerd Font
    position = 0, 70
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 55
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = $primary
    inner_color = $surface
    font_color = $on_surface
    check_color = $tertiary
    fail_color = $error
    fail_text = <i>wrong password ($ATTEMPTS)</i>
    placeholder_text = <i>password</i>
    fade_on_empty = false
    rounding = 8
    position = 0, -60
    halign = center
    valign = center
}
